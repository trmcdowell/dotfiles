add_newline = false
command_timeout = 200
format = "[$os$directory$git_branch$git_status]($style)$character"

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[character]
error_symbol = "[✗](bold color_red)"
success_symbol = "[>](bold color_aqua)"

[os]
format = "[$symbol]($style)"
style = "bold color_aqua"
disabled = false

[os.symbols]
Arch = "󰣇 "
Macos = " "

[directory]
before_repo_root_style = "bold color_aqua"
style = "bold color_aqua"
truncate_to_repo = false
truncation_length = 3
truncation_symbol = "…/"
repo_root_style = "bold color_aqua"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic color_aqua"

[git_status]
#format     = '[$all_status]($style)'
format = ''
style = "color_aqua"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked = "? "
modified = " "
stashed = ""
staged = ""
renamed = ""
deleted = ""
